[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aether-ai"
version = "0.1.0"
description = "Aether AI gateway platform"
requires-python = ">=3.10"
dependencies = [
    "openai",
    "python-dotenv",
    "requests",
    "pydantic>=2,<3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
